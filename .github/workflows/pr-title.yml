name: Pull Request Title

# Publishes the `PR Title` required status check on the pull request head.
#
# The status has to land on the head that is actually going to be merged, and
# the events that report on a new head are not symmetric:
#
#   * A head pushed with the repository GITHUB_TOKEN starts the plain
#     `pull_request` workflows but NOT `pull_request_target`. `Code Quality
#     (via vx)` regenerates `workspace-hack` with `cargo hakari` and pushes the
#     result with that token, so the last commit of every Rust pull request
#     arrives in exactly the way the `pull_request_target` path cannot see. The
#     head then carries no `PR Title` status at all: the required check can
#     never be satisfied and the pull request sits in `BLOCKED` with fully
#     green CI.
#
#   * `workflow_run` and `schedule` observe the head from outside the pull
#     request event stream. `CI` is a plain `pull_request` workflow, so it does
#     run for a token push; the hourly sweep asks the API which open pull
#     requests are missing the status and does not care who pushed anything.
#
# Every path runs the validator from a trusted checkout (the base commit for
# `pull_request_target`, the default branch otherwise) and reads the title
# through the API. Pull request code is never checked out and never executed.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Hourly best-effort sweep. `workflow_run` above is the primary self-heal:
    # it reacts to a specific head within seconds of `CI` finishing. This sweep
    # is the backstop for a head `CI` never reported on, and it runs on
    # GitHub's schedule, which is delayed under load and disabled entirely
    # after 60 days without repository activity. It narrows the window in
    # which a status can be missing; it cannot promise that one never is.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to validate. Leave empty to sweep every open pull request."
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  # One slot per pull request on the interactive path, one per source run on
  # the chained path, and one per manual run. The sweep is the only path that
  # cancels, and it has its own slot: an hourly pass must never cancel a
  # targeted backfill someone dispatched by hand.
  group: pr-title-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('ci-{0}', github.event.workflow_run.id) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  validate:
    name: PR Title Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target is privileged. Execute only the validator from the
      # trusted base commit; never check out or execute pull request code here.
      - name: Checkout trusted base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # The publisher arrived later than the base commit of some pull
      # requests, and this path deliberately checks out the base, so for those
      # runs the checkout has no `scripts/pr_title_status.py` and the step
      # fails before it can report anything.
      #
      # Take the code from the base when the base has it and fall back to the
      # default branch, which is trusted for the same reason the base is: both
      # are refs the pull request cannot write to. The pull request head is
      # never a source, here or anywhere else in this workflow.
      #
      # Both files are extracted because the publisher imports the validator,
      # and they are written outside the checkout so the working-tree copies
      # are never the ones that run.
      - name: Extract the title policy code
        id: policy-code
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          # Qualified with `origin/`. A `fetch-depth: 0` checkout fetches
          # `refs/heads/*` into `refs/remotes/origin/*` and then checks out the
          # commit detached, so no local branch is created: the bare name
          # `main` does not resolve, and `git show main:...` exits 128 with an
          # empty file rather than an error this step would notice.
          FALLBACK_REF: origin/${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          target="${RUNNER_TEMP:-/tmp}/pr-title-policy"
          rm -rf "${target}"
          mkdir -p "${target}"

          source_ref="${BASE_REF}"
          if ! git cat-file -e "${BASE_REF}:scripts/pr_title_status.py" 2>/dev/null; then
            source_ref="${FALLBACK_REF}"
            echo "::notice::The base ref predates the title policy publisher; using the default branch copy."
          fi

          git show "${source_ref}:scripts/pr_title_status.py" > "${target}/pr_title_status.py"
          git show "${source_ref}:scripts/validate_pr_title.py" > "${target}/validate_pr_title.py"

          # A failed `git show` leaves a zero-byte file behind rather than a
          # non-zero status this step would stop on, and `compileall` accepts
          # an empty file. Check the size so a miss is a loud failure instead
          # of a green run that published nothing.
          for name in pr_title_status.py validate_pr_title.py; do
            if [ ! -s "${target}/${name}" ]; then
              echo "::error::Extracted an empty ${name} from ${source_ref}; the policy code was not retrieved."
              exit 1
            fi
          done

          python3 -m compileall -q "${target}"

          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "policy_dir=${target}" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Validate titles and publish the required status
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POLICY_DIR: ${{ steps.policy-code.outputs.policy_dir }}
        shell: bash
        run: |
          set -uo pipefail

          # `inputs.pr` is an arbitrary string. Reject anything that is not a
          # bare number before it reaches a shell word, rather than relying on
          # quoting: a value such as `$(...)` would be expanded inside double
          # quotes. The script enforces the same rule on its own side.
          if [ -n "${PR_INPUT}" ] && ! printf '%s' "${PR_INPUT}" | grep -qE '^[0-9]+$'; then
            echo "::error::The 'pr' input must be a pull request number, got: ${PR_INPUT}"
            exit 1
          fi

          # Run the extracted copy, not the checkout: the checkout is the base
          # commit, which may not contain this publisher at all.
          #
          # Exit codes: 0 valid, 1 invalid title (status published), 2 nothing
          # could be published. Only 2 leaves the pull request without a
          # verdict, so only 2 may fail the run here.
          status=0
          python3 "${POLICY_DIR}/pr_title_status.py" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pr "${PR_INPUT}" \
            --target-url "${RUN_URL}" \
            --report pr-title-report.json || status=$?

          echo "status=${status}" >> "${GITHUB_OUTPUT:-/dev/null}"

          if [ "${status}" -eq 2 ]; then
            exit 1
          fi

      - name: Upload report
        if: always() && hashFiles('pr-title-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pr-title-report
          path: pr-title-report.json
          retention-days: 30

      # The published status is what blocks the merge, and it is published for
      # every path. Failing the run is the extra signal the author sees on the
      # event they triggered, so only that event fails here; the sweep reports
      # through the status and the `::error::` annotations it prints.
      - name: Enforce title policy
        if: steps.policy.outputs.status == '1' && github.event_name == 'pull_request_target'
        shell: bash
        run: exit 1
