name: Pull Request Title

# Publishes the `PR Title` required status check on the pull request head.
#
# The status has to land on the head that is actually going to be merged, and
# the events that report on a new head are not symmetric:
#
#   * A head pushed with the repository GITHUB_TOKEN starts the plain
#     `pull_request` workflows but NOT `pull_request_target`. `Code Quality
#     (via vx)` regenerates `workspace-hack` with `cargo hakari` and pushes the
#     result with that token, so the last commit of every Rust pull request
#     arrives in exactly the way the `pull_request_target` path cannot see. The
#     head then carries no `PR Title` status at all: the required check can
#     never be satisfied and the pull request sits in `BLOCKED` with fully
#     green CI.
#
#   * `workflow_run` and `schedule` observe the head from outside the pull
#     request event stream. `CI` is a plain `pull_request` workflow, so it does
#     run for a token push; the hourly sweep asks the API which open pull
#     requests are missing the status and does not care who pushed anything.
#
# Every path runs the validator from a trusted checkout (the base commit for
# `pull_request_target`, the default branch otherwise) and reads the title
# through the API. Pull request code is never checked out and never executed.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Hourly. A head that arrives without a `pull_request_target` run is
    # invisible until something looks for it, and the sweep is the only path
    # that does not depend on another event firing first.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to validate. Leave empty to sweep every open pull request."
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  # One run per pull request for the event paths. The sweep and the manual runs
  # share one slot so a slow pass cannot leave a queue behind it.
  group: pr-title-${{ github.event.pull_request.number || github.event.workflow_run.id || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  validate:
    name: PR Title Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target is privileged. Execute only the validator from the
      # trusted base commit; never check out or execute pull request code here.
      - name: Checkout trusted base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate titles and publish the required status
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          # Exit codes: 0 valid, 1 invalid title (status published), 2 nothing
          # could be published. Only 2 leaves the pull request without a
          # verdict, so only 2 may fail the run here.
          status=0
          python3 scripts/pr_title_status.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pr "${PR_INPUT}" \
            --target-url "${RUN_URL}" \
            --report pr-title-report.json || status=$?

          echo "status=${status}" >> "${GITHUB_OUTPUT:-/dev/null}"

          if [ "${status}" -eq 2 ]; then
            exit 1
          fi

      - name: Upload report
        if: always() && hashFiles('pr-title-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pr-title-report
          path: pr-title-report.json
          retention-days: 30

      # The published status is what blocks the merge, and it is published for
      # every path. Failing the run is the extra signal the author sees on the
      # event they triggered, so only that event fails here; the sweep reports
      # through the status and the `::error::` annotations it prints.
      - name: Enforce title policy
        if: steps.policy.outputs.status == '1' && github.event_name == 'pull_request_target'
        shell: bash
        run: exit 1
