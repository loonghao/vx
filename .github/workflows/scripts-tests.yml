name: Script Tests

# Unit tests for the shell and Python helpers CI depends on. They live outside
# ci.yml so the change-detection gate there stays untouched: these tests must
# run for a scripts-only pull request, which the Rust crate filters would skip.

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Script Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --severity=warning scripts/check_pr_ci_markers.sh

  syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compile scripts
        run: python3 -m compileall -q scripts
