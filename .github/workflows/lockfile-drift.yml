name: Lockfile Drift

# Fails a pull request whose real merge result would move a dependency
# backwards, relative to the base branch.
#
# `Cargo.lock` here resolves some edges to one of several versions of the same
# crate that are all present in the lockfile: `workspace-hack` (cargo-hakari)
# pins both `windows-sys 0.52` and `windows-sys 0.61` because different
# third-party crates genuinely require each of them, so crates whose own
# requirement accepts either candidate are free edges.
#
# That resolution is not stable: re-running an identical
# `cargo update -p <crate> --precise <version>` on an unchanged tree flips the
# `windows-sys` edges between `0.52.0` and `0.61.2` on every pass. Rebasing
# does not settle it either — the drift shows up in branches already rebased
# onto the current `main`. So no lockfile state prevents it, and what is left
# to do is check the outcome.
#
# Two things are checked against the `Cargo.lock` of the
# `git merge-tree --write-tree` result, so a branch lagging behind the base
# does not get blamed for the base's own progress:
#
#   * any dependency edge that the merge result would move backwards;
#   * any bump the title claims that the merged lockfile does not contain,
#     which is what a self-cancelling branch looks like. A pull request that
#     claims no bump is not held to one, so a change with no dependency
#     impact stays out of the report.
#
# A missed bump warns rather than fails, so it cannot block a merge over a
# title the parser misread.
#
# The script reads lockfile text only. Nothing is built and no pull request
# code is executed.

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/lockfile-drift.yml"
      - "scripts/check_lockfile_drift.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Lockfile Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only text is read, but the ref is still the trusted default branch:
      # nothing from the pull request is checked out to be executed.
      #
      # `fetch-depth: 0` is not decoration: `git merge-tree` refuses to merge
      # unrelated histories, and a shallow fetch of two unrelated commits is
      # exactly that. Without the merge base present the check silently falls
      # back to the head, which would blame the branch for the base's own
      # progress.
      - name: Checkout base ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # `merge-tree` needs both commits locally, so fetch the head explicitly
      # instead of checking it out. No depth limit: `fetch-depth: 0` above gave
      # a complete repository, and a shallow fetch would leave the two commits
      # unrelated.
      - name: Fetch pull request head
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.head.sha }}" --no-tags --prune --no-recurse-submodules

      # The checker is new in this pull request, so it is not in the base
      # commit yet. Take it from the base when the base has it, and only then
      # fall back to the head: a pull request must not be able to rewrite the
      # check that judges it. It is extracted to a path outside the checkout so
      # the working-tree copy is never what runs.
      - name: Extract the checker
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          script="scripts/check_lockfile_drift.py"
          target="${RUNNER_TEMP}/check_lockfile_drift.py"

          if git cat-file -e "${BASE_REF}:${script}" 2>/dev/null; then
            git show "${BASE_REF}:${script}" > "${target}"
            echo "Using the checker from the base ref."
          else
            git show "${HEAD_REF}:${script}" > "${target}"
            echo "::notice::The base ref predates the checker; using the head copy."
          fi

          python3 -m compileall -q "${target}"

      - name: Report dependencies that move backwards
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          python3 "${RUNNER_TEMP}/check_lockfile_drift.py" \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --title "${PR_TITLE}" \
            --format json \
            --output lockfile-drift.json

      - name: Upload report
        if: always() && hashFiles('lockfile-drift.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: lockfile-drift-report
          path: lockfile-drift.json
          retention-days: 30
