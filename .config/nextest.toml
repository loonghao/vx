[test-groups]
vx-benchmarks = { max-threads = 1 }

# Slow E2E/integration tests that spawn vx subprocesses.
# Isolate these with generous timeouts to avoid blocking fast unit tests.
vx-slow-e2e = { max-threads = 4 }

# ── Environment-dependent test policy ───────────────────────────────────────
#
# Every group below shells out to the real `vx` binary against real toolchains,
# so its runtime tracks runner load and network state instead of the change
# under test. Two settings keep that off the critical path:
#
#   * `slow-timeout` is a hard kill ceiling, not a warning - `terminate-after`
#     multiplies `period`, so `120s x 2` killed healthy-but-slow runs at 240s.
#     The slowest test in the suite runs ~96-106s when the runner is idle and
#     exceeded 240s under load, so the ceiling now carries real headroom.
#   * `retries` re-runs a test that fails. A transient runner stall recovers on
#     a later attempt, while a genuine regression fails every attempt - retries
#     absorb infrastructure flake without hiding product bugs.
#
# ── Benchmark tests ──────────────────────────────────────────────────────────
[[profile.default.overrides]]
filter = 'package(vx) & test(bench_)'
test-group = 'vx-benchmarks'
threads-required = 'num-test-threads'

# ── Cross-tool E2E tests (spawn multiple vx subprocesses, ~50s each) ────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(cross_tool::)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 2

# ── Info / system-tools tests (system discovery can be slow on CI) ──────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(/^test_(info|list_system)/)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "90s", terminate-after = 2 }
retries = 2

# ── Other heavy E2E tests ───────────────────────────────────────────────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(/e2e/)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 2

# The tool E2E suite's binary name includes "e2e", but individual tests are
# named by runtime module (for example pnpm::test_pnpm_dlx_cowsay). Match the
# binary explicitly so a stuck external command cannot hold CI until job timeout.
[[profile.default.overrides]]
filter = 'package(vx-cli) & binary(tool_e2e_tests)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 2
