[test-groups]
vx-benchmarks = { max-threads = 1 }

# Slow E2E/integration tests that spawn vx subprocesses.
# Isolate these with generous timeouts to avoid blocking fast unit tests.
vx-slow-e2e = { max-threads = 4 }

# ── JUnit report ────────────────────────────────────────────────────────────
#
# The only output that records *why* a test passed. A test that failed once and
# then passed carries a `<flakyFailure>` child per failed attempt; a test that
# failed every attempt carries `<failure>` instead. That difference is what
# `scripts/summarize_nextest_flaky.py` reads back into the job summary, because
# nextest itself reports a flaky test as a pass with exit 0 - without this file
# an intermittent regression absorbed by `retries` below is invisible on a green
# run. `path` is relative to the profile store directory, so the default profile
# writes to `target/nextest/default/junit.xml`.
[profile.default.junit]
path = "junit.xml"

# ── Environment-dependent test policy ───────────────────────────────────────
#
# Every group below shells out to the real `vx` binary against real toolchains,
# so its runtime tracks runner load and network state instead of the change
# under test. Two settings keep that off the critical path:
#
#   * `slow-timeout` sets two thresholds at once: `period` is both the point at
#     which a test is logged SLOW (and every multiple of it) and the base that
#     `terminate-after` multiplies into the hard kill ceiling. So keep `period`
#     at the historical SLOW threshold and raise `terminate-after` instead -
#     raising `period` would buy headroom by hiding the SLOW signal.
#     `120s x 2` killed healthy-but-slow runs at 240s, and the slowest test in
#     the suite - ~96-106s when the runner is idle - exceeded that under load.
#     `120s x 3` gives a 360s ceiling while still logging SLOW from 120s.
#   * `retries` re-runs a test that fails. A transient runner stall recovers on
#     a later attempt, while a genuine regression fails every attempt - retries
#     absorb infrastructure flake without hiding product bugs. A test that only
#     passes on a later attempt is reported as FLAKY with exit 0, so it needs
#     the JUnit report above to stay visible on an otherwise green run.
#
# Overrides are evaluated top-down and the *first* one whose filter matches
# wins - verified against cargo-nextest: of two conflicting `retries`
# overrides, `0;2` behaves like `0` and `2;0` like `2`, and reordering two
# conflicting `test-group` overrides moves the test in `show-config
# test-groups`. So position in this file is load-bearing: put a new group next
# to whatever it must take precedence over rather than at the bottom, or the
# tests an earlier override already claimed will silently keep the old
# settings.
#
# ── Benchmark tests ──────────────────────────────────────────────────────────
[[profile.default.overrides]]
filter = 'package(vx) & test(bench_)'
test-group = 'vx-benchmarks'
threads-required = 'num-test-threads'

# ── Cross-tool E2E tests (spawn multiple vx subprocesses, ~50s each) ────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(cross_tool::)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 2

# ── Info / system-tools tests (system discovery can be slow on CI) ──────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(/^test_(info|list_system)/)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "60s", terminate-after = 3 }
retries = 2

# ── Other heavy E2E tests ───────────────────────────────────────────────────
[[profile.default.overrides]]
filter = 'package(vx-cli) & test(/e2e/)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 2

# The tool E2E suite's binary name includes "e2e", but individual tests are
# named by runtime module (for example pnpm::test_pnpm_dlx_cowsay). Match the
# binary explicitly so a stuck external command cannot hold CI until job timeout.
[[profile.default.overrides]]
filter = 'package(vx-cli) & binary(tool_e2e_tests)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 2

# ── Root-package E2E / integration binaries ─────────────────────────────────
#
# `tests/e2e_*.rs`, `tests/integration_tests.rs`, `tests/cli_integration_tests.rs`
# and `tests/structured_output_e2e_tests.rs` belong to the root `vx` package,
# not to `vx-cli`, so every group above misses them and they ran on the bare
# default profile: SLOW at 60s and no `terminate-after` at all. That is the
# wrong half of the suite to leave uncovered - measured on the Windows full job,
# `vx::e2e_package_syntax_tests` is the slowest binary in the workspace at 231s,
# ahead of every `vx-cli` group this file already protects.
#
# `period` stays at the 60s default so the SLOW signal is unchanged and only the
# kill ceiling moves; `terminate-after = 6` reaches the same 360s ceiling as the
# groups above, which clears the 231s worst case measured on a loaded runner
# (no test in that run exceeded 360s).
#
# `!test(bench_)` is a guard against reordering, not a load-bearing filter:
# the benchmark override above sits earlier in the file, so `test(bench_)`
# tests are claimed by it and never reach this block. Keep the clause anyway -
# if this block is ever moved above that override, dropping it would let
# `test-group` pull `e2e_benchmark_tests` out of `vx-benchmarks`
# (max-threads = 1) into `vx-slow-e2e` (max-threads = 4) and run the
# benchmarks concurrently with each other.
[[profile.default.overrides]]
filter = 'package(vx) & binary(/e2e|integration/) & !test(bench_)'
test-group = 'vx-slow-e2e'
slow-timeout = { period = "60s", terminate-after = 6 }
retries = 2
